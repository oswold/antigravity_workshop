version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - WHATSAPP_BRIDGE_URL=http://whatsapp:3002
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - whatsapp
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  whatsapp:
    build:
      context: .
      dockerfile: Dockerfile.whatsapp
    container_name: whatsapp_bridge
    stdin_open: true
    tty: true
    restart: unless-stopped
    volumes:
      - whatsapp_auth:/app/auth_info_baileys

volumes:
  whatsapp_auth:
    external: true
    name: podcasts_whatsapp_auth